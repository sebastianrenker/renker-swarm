name: renker-swarm

# Runs on GitHub's servers (not your PC), on a schedule. GitHub's minimum cron
# interval is 5 minutes; scheduled runs can be delayed under load, and GitHub
# disables schedules after 60 days without repo activity — a manual run or any
# push re-arms them.
on:
  schedule:
    # Every 15 min — the repo is public, so GitHub Action minutes are unlimited
    # and free. This keeps the swarm "always running". (GitHub's cron minimum is
    # 5 min; scheduled runs can be delayed a little under load.)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}          # + a manual "Run workflow" button

permissions:
  contents: write                # allow committing run state back to the repo

concurrency:
  group: renker-swarm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python run_once.py

      - name: Commit run state
        run: |
          git config user.name "renker-swarm"
          git config user.email "swarm@renker.local"
          # outputs/ is a generated runtime artifact and is gitignored; only the
          # small run state is committed back so schedules stay warm across runs.
          git add state docs
          git diff --staged --quiet || git commit -m "swarm: $(date -u +%FT%TZ)"
          git push
