<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<title>RenkerSwarm Station</title>
<style>
  :root{
    --bg:#05090c; --text:#dbeef0; --muted:#7fa0a3; --teal:#2fd4bf; --good:#3ee08f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  /* top bar */
  .bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(10,20,25,.9),transparent);z-index:5}
  .brand{font-weight:800;letter-spacing:3px;font-size:18px;line-height:1}
  .brand b{color:var(--teal)} .brand span{display:block;color:#cf8350;font-size:10px;letter-spacing:4px;margin-top:3px;font-weight:600}
  .stat{margin-left:0;text-align:center}
  .stat .k{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:19px;font-weight:800;color:var(--teal)}
  .stat .v small{font-size:11px;color:var(--muted);font-weight:600}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;color:var(--good)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .spacer{flex:0 0 14px}
  /* map */
  #mapwrap{flex:1;position:relative;min-height:0}
  svg{width:100%;height:100%;display:block}
  .grid-bg{position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(800px 500px at 50% 45%,rgba(20,60,70,.25),transparent 70%),
      repeating-linear-gradient(0deg,transparent 0 33px,rgba(23,55,64,.18) 33px 34px),
      repeating-linear-gradient(90deg,transparent 0 33px,rgba(23,55,64,.16) 33px 34px)}
  .podlabel{font:700 13px "Segoe UI";fill:#eafcff;letter-spacing:1.5px}
  .podsub{font:600 10px "Segoe UI";fill:#9fc3c6}
  .cnt{font:800 13px "Segoe UI";fill:#05090c}
  .kern{font:800 12px "Segoe UI";fill:var(--teal);letter-spacing:3px}
  .kernN{font:800 22px "Segoe UI";fill:#eafcff}
  /* ticker */
  .ticker{z-index:5;background:linear-gradient(0deg,rgba(8,16,20,.96),transparent);
    padding:8px 14px 12px;max-height:26vh;overflow:hidden}
  .ticker h2{margin:0 0 6px;font-size:10px;letter-spacing:3px;color:#cf8350}
  .feed{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:20vh}
  .item{border-left:2px solid #1b8b80;padding:4px 9px;background:rgba(10,21,26,.7);border-radius:0 7px 7px 0}
  .item .h{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted)}
  .item .h b{color:var(--teal)}
  .item .t{font-size:11.5px;line-height:1.35;margin-top:2px;color:#cfe6e7}
  @media(max-width:720px){ .brand{font-size:15px} .stat .v{font-size:16px} .foothide{display:none} }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="brand"><b>RENKER</b>SWARM<span>RENKER INDUSTRIES · STATION</span></div>
    <div class="spacer"></div>
    <div class="stat"><div class="k">Agenten</div><div class="v" id="s-agents">–</div></div>
    <div class="stat"><div class="k">Geliefert</div><div class="v" id="s-worked">–</div></div>
    <div class="stat foothide"><div class="k">Budget</div><div class="v" id="s-budget">–</div></div>
    <div class="stat foothide"><div class="k">Stand</div><div class="v" id="s-updated" style="font-size:13px">–</div></div>
    <div class="live"><span class="dot"></span><span id="livetxt">LIVE</span></div>
  </div>

  <div id="mapwrap">
    <div class="grid-bg"></div>
    <svg id="map" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="ticker">
    <h2>LIVE-FEED · WAS DIE AGENTEN GERADE BAUEN</h2>
    <div class="feed" id="feed"></div>
  </div>
</div>

<script>
  const CX=500, CY=352, R=250;
  // dept name -> {angle deg, color}
  const DEPTS=[
    {id:"Kommando",  a:-90, c:"#4aa3ff"},
    {id:"Chancen",   a:-30, c:"#3ee08f"},
    {id:"Recherche", a: 30, c:"#37c6d4"},
    {id:"Kunden",    a: 90, c:"#b98cff"},
    {id:"Bau",       a:150, c:"#cf8350"},
    {id:"Finanzen",  a:210, c:"#e0c04a"},
  ];
  function pos(a){const r=a*Math.PI/180;return[CX+R*Math.cos(r),CY+R*Math.sin(r)];}
  function ago(m){m=Math.max(0,Math.round(m||0));if(m<1)return"gerade eben";if(m<60)return m+" min";const h=Math.floor(m/60);if(h<24)return h+" h";return Math.floor(h/24)+" d";}
  function esc(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
  function clip(s,n){s=(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s;}

  // ---- build static station once ----
  function buildMap(){
    const NS="http://www.w3.org/2000/svg";
    let defs=`<defs>
      <radialGradient id="core" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#eafcff"/><stop offset="35%" stop-color="#2fd4bf"/>
        <stop offset="100%" stop-color="#0c3b39"/></radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>`;
    let conduits="", packets="", pods="";
    DEPTS.forEach((d,i)=>{
      const [x,y]=pos(d.a);
      // conduit core->pod
      const pid="cond"+i;
      conduits+=`<path id="${pid}" d="M ${CX} ${CY} L ${x} ${y}" stroke="${d.c}" stroke-opacity=".28" stroke-width="3" fill="none"/>`;
      // 3 packets, staggered, flowing outward and inward
      for(let k=0;k<3;k++){
        const dur=(2.6+k*0.7+i*0.15).toFixed(2);
        const rev=k%2? 'keyPoints="1;0" keyTimes="0;1" calcMode="linear"':'';
        packets+=`<circle r="3.2" fill="${d.c}" filter="url(#glow)">
          <animateMotion dur="${dur}s" begin="${(k*0.8).toFixed(2)}s" repeatCount="indefinite" ${rev}>
            <mpath href="#${pid}"/></animateMotion></circle>`;
      }
      // pod
      const w=150,h=74;
      pods+=`<g transform="translate(${x-w/2},${y-h/2})">
        <rect width="${w}" height="${h}" rx="12" fill="#0c1a20" stroke="${d.c}" stroke-opacity=".55"/>
        <rect width="${w}" height="4" rx="2" fill="${d.c}"/>
        <text class="podlabel" x="12" y="26">${d.id.toUpperCase()}</text>
        <circle cx="${w-20}" cy="20" r="13" fill="${d.c}"/>
        <text class="cnt" x="${w-20}" y="24.5" text-anchor="middle" id="cnt-${d.id}">0</text>
        <text class="podsub" x="12" y="46" id="sub-${d.id}"></text>
        <g id="av-${d.id}"></g>
      </g>`;
    });
    // core
    const core=`<g filter="url(#glow)">
      <circle cx="${CX}" cy="${CY}" r="52" fill="url(#core)">
        <animate attributeName="r" values="50;56;50" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="${CX}" cy="${CY}" r="70" fill="none" stroke="#2fd4bf" stroke-opacity=".35" stroke-width="1.5">
        <animate attributeName="r" values="66;80;66" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/></circle>
      <text class="kern" x="${CX}" y="${CY-6}" text-anchor="middle">KERN</text>
      <text class="kernN" x="${CX}" y="${CY+18}" text-anchor="middle" id="core-n">0</text></g>`;
    document.getElementById("map").innerHTML=defs+conduits+core+pods+packets;
  }

  function setAvatars(dept,count){
    const g=document.getElementById("av-"+dept); if(!g)return;
    const n=Math.min(10,count||0); let s="";
    for(let i=0;i<n;i++){ s+=`<circle cx="${14+i*13}" cy="62" r="3.4" fill="#eafcff" opacity=".85"/>`; }
    g.innerHTML=s;
  }

  async function tick(){
    let d; try{ d=await (await fetch("./data.json?"+Date.now())).json(); }
    catch(e){ document.getElementById("livetxt").textContent="OFFLINE"; return; }
    document.getElementById("livetxt").textContent="LIVE";
    document.getElementById("s-agents").textContent=d.agents_total??"–";
    document.getElementById("s-worked").textContent=d.worked??"–";
    const b=d.budget||{}; document.getElementById("s-budget").innerHTML=(b.used??"–")+" <small>/ "+(b.cap??"–")+"</small>";
    document.getElementById("s-updated").textContent=(d.updated||"").replace("T"," ").slice(5,16);
    const coreN=document.getElementById("core-n"); if(coreN)coreN.textContent=d.worked??"0";

    const by={}; (d.departments||[]).forEach(x=>by[(x.id||"").toLowerCase()]=x);
    DEPTS.forEach(dp=>{
      const r=by[dp.id.toLowerCase()]||{count:0,latest:{}};
      const cnt=document.getElementById("cnt-"+dp.id); if(cnt)cnt.textContent=r.count||0;
      const sub=document.getElementById("sub-"+dp.id);
      if(sub){ const l=r.latest||{}; sub.textContent=l.text?clip(l.text,26):"bereit …"; }
      setAvatars(dp.id, r.count||0);
    });

    const feed=(d.recent||[]).slice(0,30).map(it=>`<div class="item">
      <div class="h"><b>${esc(it.dept||"")} · ${esc(it.agent||"")}</b><span>${esc(it.via||"")} · ${ago(it.age_min)}</span></div>
      <div class="t">${esc(clip(it.text,220))}</div></div>`).join("");
    document.getElementById("feed").innerHTML=feed||"<div style='color:#5f7d80'>Station startet …</div>";
  }
  buildMap(); tick(); setInterval(tick,30000);
</script>
</body>
</html>
