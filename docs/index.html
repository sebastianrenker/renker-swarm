<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>RenkerSwarm Station</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070b10; --panel:#0c131a; --ink:#d7f5ee; --dim:#7f9aa0; --teal:#35e0c0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"VT323",monospace}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.10) 2px 3px)}
  .hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;z-index:5;background:linear-gradient(180deg,rgba(8,15,20,.92),transparent)}
  .logo{font-family:"Press Start 2P";font-size:13px;color:var(--teal);text-shadow:2px 2px 0 #063a34}
  .logo b{color:#fff}
  .gs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .g{text-align:center;border:2px solid #204049;background:#0a1319;padding:3px 8px}
  .g .k{font-family:"Press Start 2P";font-size:7px;color:var(--dim)}
  .g .v{font-size:21px;color:var(--teal);line-height:1;margin-top:2px}
  .g .v small{font-size:13px;color:var(--dim)}
  .live{display:flex;align-items:center;gap:6px;font-family:"Press Start 2P";font-size:8px;color:#46e05a}
  .led{width:9px;height:9px;background:#46e05a;box-shadow:0 0 8px #46e05a;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .log{z-index:5;background:linear-gradient(0deg,rgba(8,15,20,.96),transparent);padding:6px 12px 10px;max-height:23vh}
  .log h2{margin:0 0 5px;font-family:"Press Start 2P";font-size:8px;color:#e0954a}
  .list{overflow:auto;max-height:17vh;display:flex;flex-direction:column;gap:4px}
  .li{border-left:3px solid #1b8b80;padding:2px 8px;background:#0a141a}
  .li .m{color:var(--dim);font-size:14px}.li .m b{color:var(--teal)}
  .li .x{font-size:15px;line-height:1.15;color:#cfe6e7}
  @media(max-width:640px){ .logo{font-size:10px} .g .v{font-size:17px} }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="logo"><b>RENKER</b>SWARM</div>
    <div class="gs">
      <div class="g"><div class="k">CREW</div><div class="v" id="s-agents">–</div></div>
      <div class="g"><div class="k">GELIEFERT</div><div class="v" id="s-worked">–</div></div>
      <div class="g"><div class="k">BUDGET</div><div class="v" id="s-budget">–</div></div>
    </div>
    <div class="live"><span class="led"></span><span id="livetxt">LIVE</span></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="log">
    <h2>&gt; LIVE-LOG // WAS DIE CREW GERADE BAUT</h2>
    <div class="list" id="feed"></div>
  </div>
</div>
<script>
const W=1000,H=640;
const ROOMS=[
  {id:"Kommando", c:"#4aa3ff", x:110,y:66, w:230,h:150, fur:["console","bigscreen"]},
  {id:"Chancen",  c:"#46e05a", x:660,y:66, w:230,h:150, fur:["console","boxes"]},
  {id:"Recherche",c:"#35d6d6", x:56, y:248,w:200,h:150, fur:["consoleL","chair"]},
  {id:"Kunden",   c:"#b06cff", x:744,y:248,w:200,h:150, fur:["bench","chair"]},
  {id:"Bau",      c:"#e08a3a", x:110,y:428,w:230,h:150, fur:["boxes","console"]},
  {id:"Finanzen", c:"#e6c534", x:660,y:428,w:230,h:150, fur:["console","chair"]},
];
const CORE={x:500,y:325,r:44};
const CHARS=["astronaut","robot","alien","bear","minion","vaultboy","secretagent","pepe"];
const DIRS=["south","north","east","west"];
const roomById={}; ROOMS.forEach(r=>{roomById[r.id.toLowerCase()]=r; r._d={count:0};});
const rnd=(a,b)=>a+Math.random()*(b-a);
const inRoom=r=>({x:rnd(r.x+22,r.x+r.w-22), y:rnd(r.y+50,r.y+r.h-20)});

// ---- assets ----
const IMG={}, FUR={}; let manifest=null, ready=false;
function loadImg(src){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
async function loadAssets(){
  try{ manifest=await (await fetch("assets/sprites/manifest.json?"+Date.now())).json(); }catch(e){ manifest={sprites:{}}; }
  const S=manifest.sprites||{};
  for(const ch of CHARS){
    IMG[ch]={walk:{},idle:null};
    for(const d of DIRS){
      const key=ch+".walk."+d, arr=S[key]||[];
      IMG[ch].walk[d]=await Promise.all(arr.slice(0,8).map(p=>loadImg("assets/sprites/"+p)));
    }
    const idleKey=(S[ch+".sit.south"]||S[ch+".blink.south"]||(S[ch+".walk.south"]||[]))[0];
    IMG[ch].idle=idleKey?await loadImg("assets/sprites/"+ (typeof idleKey==="string"?idleKey:idleKey)):null;
    if(IMG[ch].idle==null && IMG[ch].walk.south[0]) IMG[ch].idle=IMG[ch].walk.south[0];
  }
  for(const f of ["console","consoleL","bigscreen","boxes","chair","bench","core"]) FUR[f]=await loadImg("furniture/"+f+".png").then(x=>x)||await loadImg("assets/furniture/"+f+".png");
  ready=true;
}
// fix furniture path (served under assets/furniture)
async function loadFur(){ for(const f of ["console","consoleL","bigscreen","boxes","chair","bench","core"]) FUR[f]=await loadImg("assets/furniture/"+f+".png"); }

// ---- agents ----
let agents=[];
function makeAgent(room){ const p=inRoom(room); return {home:room, ch:CHARS[(Math.random()*CHARS.length)|0], x:p.x,y:p.y,tx:p.x,ty:p.y, sp:rnd(24,40), dir:"south", frame:Math.random()*8, mode:0, carry:false, t:0}; }
function retarget(a){
  const r=Math.random();
  if(r<0.13){ a.tx=CORE.x+rnd(-28,28); a.ty=CORE.y+rnd(-20,20); a.mode=1; a.carry=true; }
  else if(r<0.28){ const o=ROOMS[(Math.random()*ROOMS.length)|0]; const p=inRoom(o); a.tx=p.x;a.ty=p.y; a.mode=2; }
  else { const p=inRoom(a.home); a.tx=p.x;a.ty=p.y; a.mode=0; }
}
function syncAgents(by){
  ROOMS.forEach(r=>{ const d=by[r.id.toLowerCase()]; r._d=d||{count:0}; });
  const want={}; ROOMS.forEach(r=>want[r.id]=Math.max(2,Math.min(11,(r._d.count||0))));
  const cur={}; agents.forEach(a=>cur[a.home.id]=(cur[a.home.id]||0)+1);
  ROOMS.forEach(r=>{ let have=cur[r.id]||0; while(have<want[r.id]){agents.push(makeAgent(r));have++;}
    if(have>want[r.id]){let rm=have-want[r.id]; agents=agents.filter(a=>{if(a.home.id===r.id&&rm>0){rm--;return false;}return true;});} });
}

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let scale=1,ox=0,oy=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){const s=document.getElementById("stage");cv.width=s.clientWidth*DPR;cv.height=s.clientHeight*DPR;scale=Math.min(cv.width/W,cv.height/H);ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;}
addEventListener("resize",resize);

function drawRoom(r){
  ctx.fillStyle="rgba(10,20,26,.82)"; ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle=r.c; ctx.lineWidth=3; ctx.strokeRect(r.x+1.5,r.y+1.5,r.w-3,r.h-3);
  ctx.fillStyle=r.c; ctx.fillRect(r.x,r.y,r.w,7);
  ctx.fillStyle="#05090c"; ctx.font='9px "Press Start 2P",monospace'; ctx.textBaseline="top";
  ctx.fillText(r.id.toUpperCase(), r.x+8, r.y-0.5);
  ctx.fillStyle=r.c; ctx.font='15px VT323,monospace'; ctx.fillText("x"+(r._d.count||0), r.x+r.w-40, r.y+11);
  (r.fur||[]).forEach((f,i)=>{ const im=FUR[f]; if(im){ const s=34; ctx.drawImage(im, r.x+14+i*40, r.y+r.h-s-8, s,s);} });
}
function drawCore(){
  const t=performance.now()/1000, pr=CORE.r+Math.sin(t*3)*5;
  ctx.save();ctx.globalAlpha=.3;ctx.fillStyle="#35e0c0";ctx.beginPath();ctx.arc(CORE.x,CORE.y,pr+16,0,7);ctx.fill();ctx.restore();
  if(FUR.core){ const s=104; ctx.drawImage(FUR.core, CORE.x-s/2, CORE.y-s/2, s,s); }
  else { const g=ctx.createRadialGradient(CORE.x,CORE.y,4,CORE.x,CORE.y,CORE.r);g.addColorStop(0,"#eafcff");g.addColorStop(.4,"#35e0c0");g.addColorStop(1,"#0c3b39");ctx.fillStyle=g;ctx.beginPath();ctx.arc(CORE.x,CORE.y,CORE.r,0,7);ctx.fill(); }
  ctx.fillStyle="#35e0c0";ctx.font='8px "Press Start 2P",monospace';ctx.textAlign="center";ctx.fillText("KERN",CORE.x,CORE.y-CORE.r-14);
  ctx.fillStyle="#eafcff";ctx.font='16px VT323,monospace';ctx.fillText(String(window._worked||0),CORE.x,CORE.y+2);ctx.textAlign="left";
}
function drawAgent(a){
  const x=Math.round(a.x), y=Math.round(a.y);
  const walking=(Math.abs(a.tx-a.x)+Math.abs(a.ty-a.y))>3;
  let img=null; const set=IMG[a.ch];
  if(set){ if(walking && set.walk[a.dir] && set.walk[a.dir].length){ const fr=set.walk[a.dir]; img=fr[(a.frame|0)%fr.length]; } else img=set.idle||(set.walk.south&&set.walk.south[0]); }
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(x-8,y-2,16,4);
  const S=34;
  if(img){ ctx.drawImage(img, x-S/2, y-S+6, S,S); }
  else { ctx.fillStyle=a.home.c; ctx.fillRect(x-4,y-14,8,12); ctx.fillStyle="#eafcff"; ctx.fillRect(x-3,y-18,6,5); }
  if(a.carry){ ctx.fillStyle="#35e0c0"; ctx.fillRect(x-3,y-S+2,6,6); }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="#070b10"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  ctx.strokeStyle="rgba(30,60,70,.16)";ctx.lineWidth=1;
  for(let x=0;x<=W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ROOMS.forEach(r=>{ctx.strokeStyle=r.c+"33";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.x+r.w/2,r.y+r.h/2);ctx.lineTo(CORE.x,CORE.y);ctx.stroke();});
  ROOMS.forEach(drawRoom);
  drawCore();
  agents.sort((a,b)=>a.y-b.y);
  for(const a of agents){
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<3){ a.t+=dt; if(a.mode===1)a.carry=false; if(a.t>rnd(.3,1.6)){a.t=0;retarget(a);} }
    else{ a.x+=dx/d*a.sp*dt; a.y+=dy/d*a.sp*dt; a.frame+=a.sp*dt*0.22;
      a.dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?"east":"west") : (dy>0?"south":"north"); }
    drawAgent(a);
  }
  requestAnimationFrame(loop);
}

function ago(m){m=Math.max(0,Math.round(m||0));if(m<1)return"jetzt";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d";}
function esc(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function clip(s,n){s=(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s;}
async function tick(){
  let d; try{ d=await (await fetch("./data.json?"+Date.now())).json(); }
  catch(e){ document.getElementById("livetxt").textContent="OFFLINE"; return; }
  document.getElementById("livetxt").textContent="LIVE";
  document.getElementById("s-agents").textContent=d.agents_total??"–";
  document.getElementById("s-worked").textContent=d.worked??"–"; window._worked=d.worked||0;
  const b=d.budget||{}; document.getElementById("s-budget").innerHTML=(b.used??"–")+"<small>/"+(b.cap??"–")+"</small>";
  const by={}; (d.departments||[]).forEach(x=>by[(x.id||"").toLowerCase()]=x);
  syncAgents(by);
  document.getElementById("feed").innerHTML=(d.recent||[]).slice(0,26).map(it=>`
    <div class="li"><div class="m"><b>${esc(it.dept||"")} · ${esc(it.agent||"")}</b> — ${esc(it.via||"")} · ${ago(it.age_min)}</div>
    <div class="x">${esc(clip(it.text,190))}</div></div>`).join("")||"<div style='color:#4a666a'>Station startet …</div>";
}
(async ()=>{ resize(); syncAgents({}); tick(); setInterval(tick,30000); requestAnimationFrame(loop);
  await loadAssets(); await loadFur(); })();
</script>
</body>
</html>
