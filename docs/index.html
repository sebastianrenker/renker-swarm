<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>RenkerSwarm Station</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b10; --panel:#0c131a; --ink:#d7f5ee; --dim:#7f9aa0;
    --teal:#35e0c0; --core:#35e0c0;
    --Kommando:#4aa3ff; --Chancen:#46e05a; --Recherche:#35d6d6;
    --Kunden:#b06cff; --Bau:#e08a3a; --Finanzen:#e6c534;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(700px 380px at 50% 0%,#10202b 0,transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 15px,rgba(30,60,70,.10) 15px 16px),
      repeating-linear-gradient(90deg,transparent 0 15px,rgba(30,60,70,.09) 15px 16px);
    color:var(--ink); font-family:"VT323",monospace; image-rendering:pixelated;
    -webkit-font-smoothing:none; padding:12px; max-width:1180px; margin:0 auto;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.10) 2px 3px)}
  .px{font-family:"Press Start 2P",monospace}
  /* HUD */
  .hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:3px solid #1b3640;
    background:var(--panel);padding:10px 12px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(255,255,255,.05)}
  .logo{font-size:15px;color:var(--teal);text-shadow:2px 2px 0 #063a34}
  .logo b{color:#fff}
  .logo small{display:block;font-family:"VT323";font-size:15px;color:#e0954a;letter-spacing:2px;margin-top:4px}
  .gauges{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
  .g{border:2px solid #204049;background:#0a1319;padding:5px 9px;min-width:74px;text-align:center}
  .g .k{font-family:"Press Start 2P";font-size:7px;color:var(--dim);letter-spacing:1px}
  .g .v{font-size:24px;line-height:1;color:var(--teal);margin-top:3px}
  .g .v small{font-size:15px;color:var(--dim)}
  .liveled{display:flex;align-items:center;gap:6px;font-family:"Press Start 2P";font-size:8px;color:#46e05a}
  .led{width:10px;height:10px;background:#46e05a;box-shadow:0 0 8px #46e05a;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  /* KERN banner */
  .kern{margin-top:12px;border:3px solid var(--core);background:linear-gradient(180deg,#0b2420,#0a1519);
    padding:10px 14px;display:flex;align-items:center;gap:14px;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(53,224,192,.12),0 0 18px rgba(53,224,192,.15)}
  .kcore{width:34px;height:34px;background:var(--core);box-shadow:0 0 0 4px #0a1519,0 0 14px var(--core);animation:pulse 1.4s steps(3) infinite}
  @keyframes pulse{50%{transform:scale(.72);opacity:.8}}
  .kern .t{font-family:"Press Start 2P";font-size:10px;color:var(--core)}
  .kern .s{font-size:18px;color:var(--dim);margin-top:4px}
  /* rooms */
  .floor{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .room{border:3px solid var(--c);background:var(--panel);padding:9px 10px;min-height:150px;position:relative;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.55),inset 3px 3px 0 rgba(255,255,255,.05)}
  .room .rh{display:flex;justify-content:space-between;align-items:center}
  .room .rh .nm{font-family:"Press Start 2P";font-size:9px;color:var(--c);text-shadow:1px 1px 0 #000}
  .room .rh .ct{font-family:"Press Start 2P";font-size:9px;color:#05090c;background:var(--c);padding:3px 6px}
  .agents{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0;min-height:26px}
  .agents i{width:11px;height:11px;background:var(--c);box-shadow:2px 2px 0 rgba(0,0,0,.6);display:block;animation:bob 1s steps(2) infinite}
  .room .work{font-size:16px;line-height:1.15;color:#bfe0dd;max-height:60px;overflow:hidden}
  .room .via{position:absolute;bottom:6px;right:9px;font-family:"Press Start 2P";font-size:6px;color:var(--dim)}
  @keyframes bob{50%{transform:translateY(-3px)}}
  /* log */
  .log{margin-top:12px;border:3px solid #1b3640;background:var(--panel);padding:9px 11px;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.5),inset 3px 3px 0 rgba(255,255,255,.05)}
  .log h2{margin:0 0 6px;font-family:"Press Start 2P";font-size:8px;color:#e0954a;letter-spacing:1px}
  .log .list{max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:5px}
  .li{border-left:3px solid #1b8b80;padding:3px 8px;background:#0a141a}
  .li b{color:var(--teal)} .li .m{color:var(--dim);font-size:14px}
  .li .x{font-size:16px;line-height:1.15;color:#cfe6e7;margin-top:2px}
  .foot{margin:12px 0 4px;text-align:center;font-size:15px;color:var(--dim)}
  .foot span{border:2px solid #204049;padding:2px 8px;margin:0 3px}
  @media(max-width:820px){ .floor{grid-template-columns:repeat(2,1fr)} .logo{font-size:12px} }
  @media(max-width:520px){ .floor{grid-template-columns:1fr} .gauges{width:100%} }
</style>
</head>
<body>
  <div class="hud">
    <div class="logo px"><b>RENKER</b>SWARM<small>RENKER INDUSTRIES // STATION</small></div>
    <div class="gauges">
      <div class="g"><div class="k">AGENTS</div><div class="v" id="s-agents">–</div></div>
      <div class="g"><div class="k">GELIEFERT</div><div class="v" id="s-worked">–</div></div>
      <div class="g"><div class="k">BUDGET</div><div class="v" id="s-budget">–</div></div>
    </div>
    <div class="liveled"><span class="led"></span><span id="livetxt">LIVE</span></div>
  </div>

  <div class="kern">
    <div class="kcore"></div>
    <div><div class="t">KERN // CORE</div><div class="s"><span id="core-n">0</span> Aufgaben geliefert · Stand <span id="s-updated">–</span></div></div>
  </div>

  <div class="floor" id="floor"></div>

  <div class="log">
    <h2>&gt; LIVE-LOG // WAS DIE CREW GERADE BAUT</h2>
    <div class="list" id="feed"></div>
  </div>

  <div class="foot"><span>laeuft autonom</span><span>kostenlos</span><span>kein Eingriff</span><span>Geld/Vertraege = deine Freigabe</span></div>

<script>
  const DEPTS=["Kommando","Chancen","Recherche","Kunden","Bau","Finanzen"];
  function ago(m){m=Math.max(0,Math.round(m||0));if(m<1)return"jetzt";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d";}
  function esc(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
  function clip(s,n){s=(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s;}

  function buildFloor(){
    document.getElementById("floor").innerHTML=DEPTS.map(d=>`
      <div class="room" style="--c:var(--${d})">
        <div class="rh"><span class="nm">${d.toUpperCase()}</span><span class="ct" id="ct-${d}">0</span></div>
        <div class="agents" id="ag-${d}"></div>
        <div class="work" id="wk-${d}">bereit …</div>
        <div class="via" id="via-${d}"></div>
      </div>`).join("");
  }
  function sprites(d,n){
    const g=document.getElementById("ag-"+d); if(!g)return;
    n=Math.min(14,n||0); let s="";
    for(let i=0;i<n;i++) s+=`<i style="animation-delay:${(i%5)*0.12}s"></i>`;
    g.innerHTML=s||"<span style='color:#4a666a;font-size:13px'>–</span>";
  }
  async function tick(){
    let d; try{ d=await (await fetch("./data.json?"+Date.now())).json(); }
    catch(e){ document.getElementById("livetxt").textContent="OFFLINE"; return; }
    document.getElementById("livetxt").textContent="LIVE";
    document.getElementById("s-agents").textContent=d.agents_total??"–";
    document.getElementById("s-worked").textContent=d.worked??"–";
    const b=d.budget||{}; document.getElementById("s-budget").innerHTML=(b.used??"–")+"<small>/"+(b.cap??"–")+"</small>";
    document.getElementById("core-n").textContent=d.worked??"0";
    document.getElementById("s-updated").textContent=(d.updated||"").replace("T"," ").slice(5,16);
    const by={}; (d.departments||[]).forEach(x=>by[(x.id||"").toLowerCase()]=x);
    DEPTS.forEach(dp=>{
      const r=by[dp.toLowerCase()]||{count:0,latest:{}}; const l=r.latest||{};
      const ct=document.getElementById("ct-"+dp); if(ct)ct.textContent=r.count||0;
      const wk=document.getElementById("wk-"+dp); if(wk)wk.textContent=l.text?clip(l.text,140):"bereit …";
      const via=document.getElementById("via-"+dp); if(via)via.textContent=l.text?((l.via||"").toUpperCase()+" "+ago(l.age_min)):"";
      sprites(dp, r.count||0);
    });
    document.getElementById("feed").innerHTML=(d.recent||[]).slice(0,30).map(it=>`
      <div class="li"><div class="m"><b>${esc(it.dept||"")} · ${esc(it.agent||"")}</b> — ${esc(it.via||"")} · ${ago(it.age_min)}</div>
      <div class="x">${esc(clip(it.text,200))}</div></div>`).join("")||"<div style='color:#4a666a'>Station startet …</div>";
  }
  buildFloor(); tick(); setInterval(tick,30000);
</script>
</body>
</html>
