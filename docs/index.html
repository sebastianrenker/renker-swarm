<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f12">
<title>RenkerSwarm Station</title>
<style>
  :root{
    --bg:#080d10; --bg2:#0b1418; --panel:#0d181d; --panel2:#0f1e24;
    --line:#173038; --teal:#2fd4bf; --teal-dim:#1b8b80; --copper:#cf8350;
    --text:#dbeef0; --muted:#7fa0a3; --good:#3ee08f; --warn:#e0b23e;
    --glow:0 0 24px rgba(47,212,191,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #0e2029 0%, transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 39px,rgba(23,48,56,.35) 39px 40px),
      repeating-linear-gradient(90deg,transparent 0 39px,rgba(23,48,56,.28) 39px 40px),
      var(--bg);
    color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding:14px; max-width:1400px; margin:0 auto;
  }
  .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
  .brand{font-weight:800;letter-spacing:3px;font-size:20px}
  .brand b{color:var(--teal)}
  .brand span{color:var(--copper);letter-spacing:4px;font-size:11px;display:block;font-weight:600;margin-top:2px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--good)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .k{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .stat .v{font-size:26px;font-weight:800;color:var(--teal);margin-top:2px}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  .rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .room{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;min-height:118px;position:relative;overflow:hidden}
  .room:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),transparent)}
  .room h3{margin:0;font-size:13px;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center}
  .room h3 .n{background:#06222a;border:1px solid var(--teal-dim);color:var(--teal);border-radius:20px;padding:1px 9px;font-size:12px}
  .room p{margin:8px 0 0;font-size:12px;line-height:1.45;color:#bcd6d8;max-height:64px;overflow:hidden}
  .room .via{position:absolute;bottom:8px;right:10px;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .feed{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:300px}
  .feed h2{margin:0 0 8px;font-size:12px;letter-spacing:3px;color:var(--copper)}
  .feed .list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px;max-height:62vh}
  .item{border-left:2px solid var(--teal-dim);padding:6px 10px;background:#0a151a;border-radius:0 8px 8px 0}
  .item .h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
  .item .h b{color:var(--teal);letter-spacing:.5px}
  .item .t{font-size:12px;line-height:1.4;margin-top:3px;color:#cfe6e7}
  .foot{margin-top:12px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin:0 3px;color:var(--muted)}
  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .rooms{grid-template-columns:repeat(2,1fr)}
    .brand{font-size:17px}
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><b>RENKER</b>SWARM <span>RENKER INDUSTRIES · AUTONOME STATION</span></div>
    <div class="live"><span class="dot"></span> <span id="livetxt">LIVE</span></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Agenten</div><div class="v" id="s-agents">–</div></div>
    <div class="stat"><div class="k">Geliefert</div><div class="v" id="s-worked">–</div></div>
    <div class="stat"><div class="k">Budget heute</div><div class="v" id="s-budget">–</div></div>
    <div class="stat"><div class="k">Stand</div><div class="v" id="s-updated" style="font-size:15px">–</div></div>
  </div>

  <div class="grid">
    <div class="rooms" id="rooms"></div>
    <div class="feed">
      <h2>LIVE-FEED · WAS DIE AGENTEN GERADE BAUEN</h2>
      <div class="list" id="feed"></div>
    </div>
  </div>

  <div class="foot">
    <span class="pill">läuft autonom</span>
    <span class="pill">kostenlos</span>
    <span class="pill">kein Eingriff nötig</span>
    <span class="pill">Geld/Verträge = deine Freigabe</span>
  </div>

<script>
  const DEPT_ORDER = ["Kommando","Chancen","Recherche","Kunden","Bau","Finanzen"];
  function ago(m){ m=Math.max(0,Math.round(m||0)); if(m<1)return"gerade eben"; if(m<60)return m+" min"; const h=Math.floor(m/60); if(h<24)return h+" h"; return Math.floor(h/24)+" d"; }
  function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function clip(s,n){ s=(s||"").replace(/\s+/g," ").trim(); return s.length>n? s.slice(0,n)+"…":s; }

  async function tick(){
    let d; try{ d=await (await fetch("./data.json?"+Date.now())).json(); }
    catch(e){ document.getElementById("livetxt").textContent="OFFLINE"; return; }
    document.getElementById("s-agents").textContent = d.agents_total ?? "–";
    document.getElementById("s-worked").textContent = d.worked ?? "–";
    const b=d.budget||{}; document.getElementById("s-budget").innerHTML = (b.used??"–")+" <small>/ "+(b.cap??"–")+"</small>";
    document.getElementById("s-updated").textContent = (d.updated||"").replace("T"," ").replace("Z","").slice(5,16);

    // Rooms
    const byId={}; (d.departments||[]).forEach(x=>byId[(x.id||"").toLowerCase()]=x);
    const rooms = DEPT_ORDER.map(name=>{
      const r = byId[name.toLowerCase()] || {count:0,latest:{}};
      const l = r.latest||{};
      return `<div class="room"><h3><span>${name.toUpperCase()}</span><span class="n">${r.count||0}</span></h3>
        <p>${esc(clip(l.text,180))||"<span style='color:#5f7d80'>bereit …</span>"}</p>
        <div class="via">${(l.via||"").toUpperCase()} · ${l.text?ago(l.age_min):""}</div></div>`;
    }).join("");
    document.getElementById("rooms").innerHTML = rooms;

    // Live feed
    const feed=(d.recent||[]).slice(0,40).map(it=>`<div class="item">
      <div class="h"><b>${esc(it.dept||"")} · ${esc(it.agent||"")}</b><span>${esc(it.via||"")} · ${ago(it.age_min)}</span></div>
      <div class="t">${esc(clip(it.text,240))}</div></div>`).join("");
    document.getElementById("feed").innerHTML = feed || "<div style='color:#5f7d80'>Station startet …</div>";
    document.getElementById("livetxt").textContent="LIVE";
  }
  tick(); setInterval(tick, 30000);
</script>
</body>
</html>
