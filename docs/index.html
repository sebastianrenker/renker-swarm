<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b10">
<title>RenkerSwarm Station</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070b10; --panel:#0c131a; --ink:#d7f5ee; --dim:#7f9aa0; --teal:#35e0c0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"VT323",monospace}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.10) 2px 3px)}
  .hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;z-index:5;
    background:linear-gradient(180deg,rgba(8,15,20,.92),transparent)}
  .logo{font-family:"Press Start 2P";font-size:13px;color:var(--teal);text-shadow:2px 2px 0 #063a34}
  .logo b{color:#fff}
  .g{margin-left:0;text-align:center;border:2px solid #204049;background:#0a1319;padding:3px 8px}
  .g .k{font-family:"Press Start 2P";font-size:7px;color:var(--dim)}
  .g .v{font-size:21px;color:var(--teal);line-height:1;margin-top:2px}
  .g .v small{font-size:13px;color:var(--dim)}
  .gs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .live{display:flex;align-items:center;gap:6px;font-family:"Press Start 2P";font-size:8px;color:#46e05a}
  .led{width:9px;height:9px;background:#46e05a;box-shadow:0 0 8px #46e05a;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #stage{flex:1;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .log{z-index:5;background:linear-gradient(0deg,rgba(8,15,20,.96),transparent);padding:6px 12px 10px;max-height:24vh}
  .log h2{margin:0 0 5px;font-family:"Press Start 2P";font-size:8px;color:#e0954a}
  .list{overflow:auto;max-height:18vh;display:flex;flex-direction:column;gap:4px}
  .li{border-left:3px solid #1b8b80;padding:2px 8px;background:#0a141a}
  .li .m{color:var(--dim);font-size:14px}.li .m b{color:var(--teal)}
  .li .x{font-size:15px;line-height:1.15;color:#cfe6e7}
  @media(max-width:640px){ .logo{font-size:10px} .g .v{font-size:17px} }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="logo"><b>RENKER</b>SWARM</div>
    <div class="gs">
      <div class="g"><div class="k">AGENTS</div><div class="v" id="s-agents">–</div></div>
      <div class="g"><div class="k">GELIEFERT</div><div class="v" id="s-worked">–</div></div>
      <div class="g"><div class="k">BUDGET</div><div class="v" id="s-budget">–</div></div>
    </div>
    <div class="live"><span class="led"></span><span id="livetxt">LIVE</span></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="log">
    <h2>&gt; LIVE-LOG // WAS DIE CREW GERADE BAUT</h2>
    <div class="list" id="feed"></div>
  </div>
</div>
<script>
const W=1000,H=640;
const ROOMS=[
  {id:"Kommando", c:"#4aa3ff", x:110, y:70,  w:230, h:150},
  {id:"Chancen",  c:"#46e05a", x:660, y:70,  w:230, h:150},
  {id:"Recherche",c:"#35d6d6", x:60,  y:250, w:200, h:150},
  {id:"Kunden",   c:"#b06cff", x:740, y:250, w:200, h:150},
  {id:"Bau",      c:"#e08a3a", x:110, y:430, w:230, h:150},
  {id:"Finanzen", c:"#e6c534", x:660, y:430, w:230, h:150},
];
const CORE={x:500,y:325,r:46};
const roomById={}; ROOMS.forEach(r=>roomById[r.id.toLowerCase()]=r);
const rnd=(a,b)=>a+Math.random()*(b-a);
function inRoom(r){return {x:rnd(r.x+16,r.x+r.w-16), y:rnd(r.y+40,r.y+r.h-16)};}

let agents=[], packets=[];
function makeAgent(room){
  const p=inRoom(room);
  return {home:room, c:room.c, x:p.x, y:p.y, tx:p.x, ty:p.y, sp:rnd(26,44), step:Math.random()*10, mode:0, carry:false, t:0};
}
function retarget(a){
  const r=Math.random();
  if(r<0.14){ a.tx=CORE.x+rnd(-30,30); a.ty=CORE.y+rnd(-24,24); a.mode=1; a.carry=true; }      // liefern -> Kern
  else if(r<0.30){ const o=ROOMS[(Math.random()*ROOMS.length)|0]; const p=inRoom(o); a.tx=p.x; a.ty=p.y; a.mode=2; } // besuchen
  else { const p=inRoom(a.home); a.tx=p.x; a.ty=p.y; a.mode=0; }                                 // wandern
}
function syncAgents(depts){
  const want={}; let cap;
  ROOMS.forEach(r=>{ const d=depts[r.id.toLowerCase()]; const c=d?d.count||0:0; want[r.id]=Math.max(2,Math.min(12,c)); });
  // rebuild simply to match counts
  const cur={}; agents.forEach(a=>cur[a.home.id]=(cur[a.home.id]||0)+1);
  ROOMS.forEach(r=>{
    let have=cur[r.id]||0, need=want[r.id];
    while(have<need){ agents.push(makeAgent(r)); have++; }
    if(have>need){ let rm=have-need; agents=agents.filter(a=>{ if(a.home.id===r.id&&rm>0){rm--;return false;} return true; }); }
  });
}

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let scale=1, ox=0, oy=0, DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  const s=document.getElementById("stage"); cv.width=s.clientWidth*DPR; cv.height=s.clientHeight*DPR;
  scale=Math.min(cv.width/W, cv.height/H); ox=(cv.width-W*scale)/2; oy=(cv.height-H*scale)/2;
}
window.addEventListener("resize",resize);

function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function drawRoom(r){
  rect(r.x,r.y,r.w,r.h,"rgba(10,20,26,.85)");
  ctx.strokeStyle=r.c; ctx.lineWidth=3; ctx.strokeRect(r.x+1.5,r.y+1.5,r.w-3,r.h-3);
  rect(r.x,r.y,r.w,7,r.c);
  ctx.fillStyle="#05090c"; ctx.font='9px "Press Start 2P",monospace'; ctx.textBaseline="top";
  ctx.fillText(r.id.toUpperCase(), r.x+8, r.y-0.5);
  const d=roomById[r.id.toLowerCase()]._d;
  ctx.fillStyle=r.c; ctx.font='14px VT323,monospace';
  if(d){ ctx.fillText("x"+(d.count||0), r.x+r.w-42, r.y+11); }
}
function drawAgent(a){
  const x=Math.round(a.x), y=Math.round(a.y);
  const walking = (Math.abs(a.tx-a.x)+Math.abs(a.ty-a.y))>2;
  const bob = walking ? ((a.step|0)%12<6?0:-1) : 0;
  rect(x-2, y+2, 5, 1, "rgba(0,0,0,.45)");      // shadow
  rect(x-1, y-6+bob, 3, 3, "#eafcff");           // head
  rect(x-2, y-3+bob, 4, 4, a.c);                 // body
  if(a.carry){ rect(x-1, y-10+bob, 3, 3, "#35e0c0"); } // packet
}
function drawCore(){
  const t=performance.now()/1000; const pr=CORE.r+Math.sin(t*3)*5;
  ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle="#35e0c0";
  ctx.beginPath();ctx.arc(CORE.x,CORE.y,pr+16,0,7);ctx.fill(); ctx.restore();
  const g=ctx.createRadialGradient(CORE.x,CORE.y,4,CORE.x,CORE.y,CORE.r);
  g.addColorStop(0,"#eafcff");g.addColorStop(.4,"#35e0c0");g.addColorStop(1,"#0c3b39");
  ctx.fillStyle=g; ctx.beginPath();ctx.arc(CORE.x,CORE.y,CORE.r,0,7);ctx.fill();
  ctx.fillStyle="#eafcff"; ctx.font='16px VT323,monospace'; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(String(window._worked||0), CORE.x, CORE.y); ctx.textAlign="left";
  ctx.fillStyle="#35e0c0"; ctx.font='8px "Press Start 2P",monospace'; ctx.textAlign="center";
  ctx.fillText("KERN", CORE.x, CORE.y-CORE.r-12); ctx.textAlign="left";
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="#070b10"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  // floor grid
  ctx.strokeStyle="rgba(30,60,70,.18)"; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // conduits room->core
  ROOMS.forEach(r=>{ ctx.strokeStyle=r.c+"44"; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(r.x+r.w/2,r.y+r.h/2); ctx.lineTo(CORE.x,CORE.y); ctx.stroke(); });
  ROOMS.forEach(drawRoom);
  drawCore();
  // update + draw agents
  agents.sort((a,b)=>a.y-b.y);
  for(const a of agents){
    const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
    if(d<3){ a.t+=dt; if(a.mode===1){ a.carry=false; window._worked=(window._worked||0); } if(a.t>rnd(.2,1.4)){ a.t=0; retarget(a);} }
    else { a.x+=dx/d*a.sp*dt; a.y+=dy/d*a.sp*dt; a.step+=a.sp*dt*0.25; }
    drawAgent(a);
  }
  requestAnimationFrame(loop);
}

function ago(m){m=Math.max(0,Math.round(m||0));if(m<1)return"jetzt";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d";}
function esc(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function clip(s,n){s=(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s;}
async function tick(){
  let d; try{ d=await (await fetch("./data.json?"+Date.now())).json(); }
  catch(e){ document.getElementById("livetxt").textContent="OFFLINE"; return; }
  document.getElementById("livetxt").textContent="LIVE";
  document.getElementById("s-agents").textContent=d.agents_total??"–";
  document.getElementById("s-worked").textContent=d.worked??"–"; window._worked=d.worked||0;
  const b=d.budget||{}; document.getElementById("s-budget").innerHTML=(b.used??"–")+"<small>/"+(b.cap??"–")+"</small>";
  const by={}; (d.departments||[]).forEach(x=>by[(x.id||"").toLowerCase()]=x);
  ROOMS.forEach(r=>{ roomById[r.id.toLowerCase()]._d = by[r.id.toLowerCase()]||{count:0}; });
  syncAgents(by);
  document.getElementById("feed").innerHTML=(d.recent||[]).slice(0,26).map(it=>`
    <div class="li"><div class="m"><b>${esc(it.dept||"")} · ${esc(it.agent||"")}</b> — ${esc(it.via||"")} · ${ago(it.age_min)}</div>
    <div class="x">${esc(clip(it.text,190))}</div></div>`).join("")||"<div style='color:#4a666a'>Station startet …</div>";
}
ROOMS.forEach(r=>r._d={count:0});
resize(); syncAgents({}); tick(); setInterval(tick,30000); requestAnimationFrame(loop);
</script>
</body>
</html>
